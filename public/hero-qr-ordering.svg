<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Customer scanning a QR code at a restaurant table</title>
  <desc id="desc">Illustration of a diner scanning a QR code menu at a restaurant table</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6f0"/>
      <stop offset="100%" stop-color="#e8f5ef"/>
    </linearGradient>
    <linearGradient id="table" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5ebe0"/>
      <stop offset="100%" stop-color="#e8d5c4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#bg)" rx="24"/>
  <ellipse cx="400" cy="470" rx="280" ry="28" fill="#1e4d3b" opacity="0.08"/>

  <!-- table -->
  <rect x="120" y="300" width="560" height="24" rx="8" fill="url(#table)"/>
  <rect x="160" y="324" width="18" height="120" rx="4" fill="#d4b896"/>
  <rect x="622" y="324" width="18" height="120" rx="4" fill="#d4b896"/>

  <!-- plate -->
  <ellipse cx="280" cy="292" rx="52" ry="14" fill="#fff" stroke="#e87722" stroke-width="2"/>
  <ellipse cx="280" cy="288" rx="38" ry="10" fill="#ffe8d6"/>

  <!-- phone in hand -->
  <g transform="translate(430 140)">
    <rect x="0" y="0" width="130" height="220" rx="18" fill="#1a1a2e"/>
    <rect x="8" y="12" width="114" height="196" rx="12" fill="#fff"/>
    <!-- QR on screen -->
    <rect x="28" y="36" width="74" height="74" rx="6" fill="#fff" stroke="#1e4d3b" stroke-width="3"/>
    <rect x="36" y="44" width="18" height="18" fill="#1e4d3b"/>
    <rect x="76" y="44" width="18" height="18" fill="#1e4d3b"/>
    <rect x="36" y="84" width="18" height="18" fill="#1e4d3b"/>
    <rect x="58" y="66" width="10" height="10" fill="#e87722"/>
    <rect x="72" y="80" width="14" height="6" fill="#1e4d3b"/>
    <rect x="58" y="92" width="22" height="6" fill="#1e4d3b"/>
    <rect x="36" y="124" width="58" height="8" rx="4" fill="#e87722" opacity="0.7"/>
    <rect x="36" y="140" width="74" height="8" rx="4" fill="#ddd"/>
    <rect x="36" y="156" width="50" height="8" rx="4" fill="#ddd"/>
    <!-- scan frame -->
    <path d="M20 30 H44 V54 M110 30 H86 V54 M20 170 H44 V146 M110 170 H86 V146" fill="none" stroke="#e87722" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- hand -->
  <path d="M410 310 Q430 280 460 260 Q490 250 510 270 L520 300 Q500 320 470 330 Q440 340 410 310 Z" fill="#f4c9a0"/>
  <path d="M510 270 Q540 260 560 280 L555 310 Q530 320 520 300 Z" fill="#e8b48a"/>

  <!-- QR stand on table -->
  <g transform="translate(500 230)">
    <path d="M0 70 L40 0 L80 70 Z" fill="#fff" stroke="#e87722" stroke-width="2"/>
    <rect x="18" y="18" width="44" height="44" rx="4" fill="#fff" stroke="#1e4d3b" stroke-width="2"/>
    <rect x="24" y="24" width="12" height="12" fill="#1e4d3b"/>
    <rect x="44" y="24" width="12" height="12" fill="#1e4d3b"/>
    <rect x="24" y="44" width="12" height="12" fill="#1e4d3b"/>
    <rect x="40" y="40" width="8" height="8" fill="#e87722"/>
    <rect x="36" y="52" width="16" height="4" fill="#1e4d3b"/>
  </g>

  <!-- decorative elements -->
  <circle cx="680" cy="100" r="28" fill="#e87722" opacity="0.15"/>
  <circle cx="100" cy="180" r="20" fill="#1e4d3b" opacity="0.12"/>
  <text x="400" y="60" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#1e4d3b">Scan · Order · Enjoy</text>
  <text x="400" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#e87722">Sambhrama QR Menu</text>
</svg>
